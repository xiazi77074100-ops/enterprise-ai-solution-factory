name: ci

on:
  push:
    branches: [main, "cc/**", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/sync_skills.py --check
      - run: pip install jsonschema pyyaml openapi-spec-validator
      - run: python scripts/validate_contracts.py

  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: easf
          POSTGRES_USER: easf_owner
          POSTGRES_PASSWORD: ci-owner-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U easf_owner -d easf" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      EASF_ENV: test
      EASF_SECRET_KEY: ci-only-secret-key-0123456789-abcdefghij
      EASF_MIGRATION_DATABASE_URL: postgresql+psycopg://easf_owner:ci-owner-password@127.0.0.1:5432/easf
      EASF_DATABASE_URL: postgresql+psycopg://easf_app:ci-app-password@127.0.0.1:5432/easf
      EASF_TEST_DATABASE_URL: postgresql+psycopg://easf_app:ci-app-password@127.0.0.1:5432/easf_test
      EASF_TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://easf_owner:ci-owner-password@127.0.0.1:5432/easf_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create application role (same as docker/postgres/01-app-role.sh)
        run: |
          sudo apt-get install -y -q postgresql-client >/dev/null
          PGPASSWORD=ci-owner-password POSTGRES_USER=easf_owner POSTGRES_DB=easf EASF_APP_DB_PASSWORD=ci-app-password \
            PGHOST=127.0.0.1 sh ../docker/postgres/01-app-role.sh
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check . ../fixtures
      - run: uv run ruff format --check . ../fixtures
      - run: uv run mypy app tests
      - run: uv run bandit -q -r app
      - run: uv run pip-audit
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: No source maps in the build
        run: test -z "$(find dist -name '*.map')"
