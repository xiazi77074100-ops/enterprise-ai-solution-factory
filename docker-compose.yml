# Local only (D-006). Ports bind to 127.0.0.1. Values come from .env (copy .env.example).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: easf
      POSTGRES_USER: easf_owner
      POSTGRES_PASSWORD: ${EASF_OWNER_DB_PASSWORD:?set in .env}
      EASF_APP_DB_PASSWORD: ${EASF_APP_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${EASF_DB_PORT:-55432}:5432"
    volumes:
      - easf_db:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easf_owner -d easf"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Started only with `--profile app` (security assessment / container checks). Dev runs uvicorn locally.
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: easf-backend:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      EASF_ENV: assessment  # fixed: never assess with dev settings (jp-vuln-assessment §0)
      EASF_DATABASE_URL: postgresql+psycopg://easf_app:${EASF_APP_DB_PASSWORD}@db:5432/easf
      EASF_SECRET_KEY: ${EASF_SECRET_KEY:?set in .env}
      EASF_SITE_ORIGIN: ${EASF_SITE_ORIGIN:-http://localhost:5173}
      EASF_STORAGE_DIR: /data/documents
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - easf_documents:/data/documents  # uploaded documents; never served
    read_only: true
    # VA-G2-001: multipart uploads over 1 MB are spooled to a temporary file; keep the root read-only.
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

volumes:
  easf_db:
  easf_documents:
